name: Deploy Job App to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "🚀 Starting Automated Deployment for Job-App..."

            # 1. Sync job-shared library first to prevent dependency desync
            echo "📦 Syncing shared library..."
            cd /opt/job-platform/job-shared
            git fetch origin main
            git reset --hard origin/main

            # 2. Check changes in job-app
            echo "🔍 Checking changes in Job-App..."
            cd /opt/job-platform/job-app
            git fetch origin main

            NEEDS_BUILD=$(git diff --name-only HEAD origin/main | grep -E "^(composer\.(json|lock)|package(-lock)?\.json|Dockerfile|Caddyfile|php\.ini|vite\.config\.js|tailwind\.config\.js|resources/(css|js))" || true)

            git reset --hard origin/main

            if [ -n "$NEEDS_BUILD" ]; then
              echo "🔨 Build required due to: $NEEDS_BUILD"
              echo "⚙️ Rebuilding Job-App Docker container safely..."
              cd /opt/job-platform
              docker compose up -d --build --no-deps job-app
            else
              echo "⚡ Fast sync: Code-only changes detected. Syncing in-place..."
              docker cp /opt/job-platform/job-app/app/. job_app_web:/app/app/
              docker cp /opt/job-platform/job-app/resources/. job_app_web:/app/resources/
              docker cp /opt/job-platform/job-app/routes/. job_app_web:/app/routes/
              docker cp /opt/job-platform/job-app/config/. job_app_web:/app/config/
              docker cp /opt/job-platform/job-app/database/. job_app_web:/app/database/

              # Sync latest shared library into container
              docker cp /opt/job-platform/job-shared/src/. job_app_web:/app/vendor/job/shared/src/
              docker cp /opt/job-platform/job-shared/src/Support/. job_app_web:/app/app/Support/ 2>/dev/null || true
              docker cp /opt/job-platform/job-shared/src/Enums/. job_app_web:/app/app/Enums/ 2>/dev/null || true
            fi

            # 3. Safe database migrations check
            echo "🗄️ Running migrations if any..."
            docker exec job_app_web php artisan migrate --force

            # 4. Optimize framework caches & restart workers
            echo "🧹 Clearing and optimizing caches..."
            docker exec job_app_web php artisan optimize:clear
            docker exec job_app_web php artisan optimize
            docker exec job_app_web php artisan queue:restart 2>/dev/null || true

            # 5. Clean up old unused images to save VPS disk space
            echo "🗑️ Cleaning up dangling images..."
            docker image prune -f

            echo "✅ Job-App Deployment Successful!"